global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout check 2s

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 1s
    hold other 1s
    hold refused 1s
    hold timeout 1s
    hold obsolete 1s

frontend postgres_writer
    bind *:5000
    default_backend patroni_primary

frontend postgres_reader
    bind *:5001
    default_backend patroni_replicas

frontend stats
    bind *:7000
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s

backend patroni_primary
    option httpchk GET /ready-write
    http-check expect status 200
    default-server inter 1s fall 1 rise 2 on-marked-down shutdown-sessions
    server postgres-node-1 postgres-node-1:5432 check port 8010 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-2 postgres-node-2:5432 check port 8010 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-3 postgres-node-3:5432 check port 8010 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-4 postgres-node-4:5432 check port 8010 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-5 postgres-node-5:5432 check port 8010 resolvers docker init-addr libc,none resolve-prefer ipv4

backend patroni_replicas
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres-node-1 postgres-node-1:5432 check port 8008 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-2 postgres-node-2:5432 check port 8008 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-3 postgres-node-3:5432 check port 8008 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-4 postgres-node-4:5432 check port 8008 resolvers docker init-addr libc,none resolve-prefer ipv4
    server postgres-node-5 postgres-node-5:5432 check port 8008 resolvers docker init-addr libc,none resolve-prefer ipv4
